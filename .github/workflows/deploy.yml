name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aim-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aim-client/package-lock.json

      - run: npm ci

      - uses: actions/configure-pages@v5

      - name: Build (static export)
        run: npx next build --webpack
        env:
          # Settings > Secrets and variables > Actions > Variables 에 등록한 값
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          # 프로젝트 사이트 주소(/aim_frontend/)용. 커스텀 도메인을 쓰면 빈 값으로 바꾼다.
          NEXT_PUBLIC_BASE_PATH: /aim_frontend

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: aim-client/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
